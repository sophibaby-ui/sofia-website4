<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>森林測驗統計｜Sofia</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: a single reading column of quiet paper panels; one forest-green accent carries every bar */
:root {
  --paper: #FAF7F2;
  --card: #FFFDF8;
  --cream: #F5F0E8;
  --sand: #E8DFD0;
  --ink: #2C2825;
  --soft: #6B6259;
  --forest: #3D5A4C;
  --moss: #8FB59A;
  --moss-tint: #E3ECE1;
  --warn: #B4693F;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 36px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.kicker { font-size: 12px; letter-spacing: .2em; color: var(--forest); }
h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 2px 0 0; letter-spacing: .02em; }
h2 { font-family: var(--serif); font-weight: 600; font-size: 18px; margin: 0; }
.sub { font-size: 13px; color: var(--soft); margin: 2px 0 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--cream); border-radius: 999px; padding: 3px; }
.seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--soft); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--forest); box-shadow: 0 1px 4px rgba(44,40,37,.1); }
select, input[type=password], input[type=text] { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--sand); border-radius: 10px; padding: 7px 10px; }
.btn { font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 18px; background: var(--forest); color: var(--cream); cursor: pointer; }
.btn.ghost { background: none; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

.panel { background: var(--card); border: 1px solid var(--sand); border-radius: 18px; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel .note { font-size: 12.5px; color: var(--soft); margin: -8px 0 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--sand); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .l { font-size: 12.5px; color: var(--soft); }
.kpi .v { font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--forest); font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi .h { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }

.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(84px, 9.5em) 1fr 4.6em; gap: 10px; align-items: center; font-size: 13.5px; }
.bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .t { position: relative; height: 18px; background: var(--cream); border-radius: 6px; overflow: hidden; }
.bar .f { position: absolute; inset: 0 auto 0 0; background: var(--moss); border-radius: 6px; }
.bar.top .f { background: var(--forest); }
.bar .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--soft); font-size: 12.5px; white-space: nowrap; }
.bar .c b { color: var(--ink); font-weight: 500; font-size: 13.5px; }

.funnel .bar { grid-template-columns: minmax(84px, 7.5em) 1fr 6.4em; }
.drop { font-size: 12px; color: var(--soft); padding-left: calc(min(7.5em, 30%) + 10px); margin: -3px 0 1px; font-variant-numeric: tabular-nums; }
.drop.big { color: var(--warn); font-weight: 500; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--sand); white-space: nowrap; }
th { font-weight: 500; color: var(--soft); background: var(--cream); }
.pill { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 12px; background: var(--cream); }
.pill.hi { background: var(--forest); color: var(--cream); }
.pill.mid { background: var(--moss-tint); }

.gate { max-width: 420px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--sand); border-radius: 20px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.gate form { display: flex; gap: 8px; flex-wrap: wrap; }
.gate input { flex: 1 1 180px; }
.msg { font-size: 13px; color: var(--warn); min-height: 1.2em; margin: 0; }
.empty { color: var(--soft); font-size: 14px; padding: 8px 0; }

@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .grid2, .grid3 { grid-template-columns: 1fr; } h1 { font-size: 24px; } .kpi .v { font-size: 24px; } }
</style>
</head>
<body>

<section class="gate" id="gate">
  <div>
    <div class="kicker">SOFIA・森林心理測驗</div>
    <h1>統計後台</h1>
    <p class="sub">輸入通行碼查看測驗數據，這台裝置之後會記住</p>
  </div>
  <form id="gateForm">
    <label for="key" hidden>通行碼</label>
    <input type="password" id="key" autocomplete="current-password" placeholder="通行碼">
    <button class="btn" type="submit" id="enter">查看數據</button>
  </form>
  <p class="msg" id="gateMsg" aria-live="polite"></p>
</section>

<main class="wrap" id="app" hidden>
  <header>
    <div>
      <div class="kicker">SOFIA・森林心理測驗</div>
      <h1>森林測驗統計</h1>
      <p class="sub" id="updated">讀取中</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="時間範圍" id="range">
        <button type="button" data-d="7" aria-pressed="false">近 7 天</button>
        <button type="button" data-d="30" aria-pressed="false">近 30 天</button>
        <button type="button" data-d="0" aria-pressed="true">全部</button>
      </div>
      <label for="src" hidden>來源</label>
      <select id="src"><option value="">所有來源</option></select>
      <button class="btn" type="button" id="reload">重新整理</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <h2>每一題還剩下多少人</h2>
    <p class="note">從打開頁面到看到結果，每一步有幾個人走到，橘色是流失最多的地方</p>
    <div class="bars funnel" id="funnel"></div>
  </section>

  <section class="grid2">
    <div class="panel">
      <h2>結果類型</h2>
      <p class="note">只算完成測驗的人</p>
      <div class="bars" id="results"></div>
    </div>
    <div class="panel" style="gap:22px">
      <div style="display:flex;flex-direction:column;gap:14px"><h2>最在意的主題</h2><div class="bars" id="topic"></div></div>
      <div style="display:flex;flex-direction:column;gap:14px"><h2>準備度</h2><div class="bars" id="ready"></div></div>
      <div style="display:flex;flex-direction:column;gap:14px"><h2>來源</h2><div class="bars" id="source"></div></div>
    </div>
  </section>

  <section class="grid3">
    <div class="panel"><h2>想起的人</h2><div class="bars" id="who"></div></div>
    <div class="panel"><h2>卡多久</h2><div class="bars" id="howlong"></div></div>
    <div class="panel"><h2>因應方式</h2><div class="bars" id="cope"></div></div>
  </section>

  <section class="panel">
    <h2>最近完成的人</h2>
    <p class="note">按下「開啟 LINE 傳送」的人，通常很快就會在 LINE 傳結果給你</p>
    <div class="tbl" id="recent"></div>
  </section>

  <div><button class="btn ghost" type="button" id="logout">登出這台裝置</button></div>
</main>

<script>
const STEPS = ["開場", "開始", "第1題", "第2題", "第3題", "第4題", "第5題", "第6題", "看到結果"];
const STEP_LABEL = { "開場": "打開頁面", "開始": "按下開始", "看到結果": "看到結果" };
const ORDER = {
  topic: ["親密關係", "人生方向", "關係界線", "身心疲憊"],
  ready: ["陪伴型", "釐清型", "傾訴型", "行動型"],
  who: ["伴侶／前任", "家人", "工作／日常的人", "自己"],
  howlong: ["最近才開始", "持續一段時間", "反覆出現的模式", "很久以前就開始"],
  cope: ["自己消化", "硬撐往前", "找人陪伴", "讓情緒流動"]
};
const SRC_NAME = { fb: "Facebook", line: "LINE", "直接開啟": "直接開啟" };
let ALL = [], key = "", days = 0, src = "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
const srcName = s => SRC_NAME[s] || (/facebook|fb\./.test(s) ? "Facebook" : /line\./.test(s) ? "LINE" : s || "未知");
const stepIdx = r => r.status === "完成" ? STEPS.length - 1 : Math.max(0, STEPS.indexOf(r.step));
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }

async function fetchRows(k) {
  const r = await fetch("/api/quiz-stats?key=" + encodeURIComponent(k), { cache: "no-store" });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!j) throw new Error("讀不到資料，稍後再試一次");
  if (!j.ok) {
    if (j.message === "wrong_key") throw new Error("通行碼不對，再確認一次");
    if (j.message === "script_not_updated") throw new Error("Google Apps Script 還沒更新，貼上新版並重新部署後就能看到");
    throw new Error("讀不到資料，稍後再試一次");
  }
  return j.rows || [];
}

function bars(el, entries, total, opts = {}) {
  if (!entries.length || !total) { el.innerHTML = `<div class="empty">還沒有資料</div>`; return; }
  const max = Math.max(...entries.map(e => e[1]));
  el.innerHTML = entries.map(([name, n]) =>
    `<div class="bar${n === max && n > 0 ? " top" : ""}"><span class="n" title="${esc(name)}">${esc(name)}</span>
      <span class="t"><span class="f" style="width:${max ? n / max * 100 : 0}%"></span></span>
      <span class="c"><b>${n}</b> ${pct(n, total)}</span></div>`).join("");
}
function count(rows, field, order) {
  const m = new Map();
  (order || []).forEach(k => m.set(k, 0));
  rows.forEach(r => { const v = field === "source" ? srcName(r.source) : r[field]; if (v) m.set(v, (m.get(v) || 0) + 1); });
  const list = [...m.entries()];
  return order ? list : list.sort((a, b) => b[1] - a[1]);
}

function render() {
  const now = Date.now();
  const rows = ALL.filter(r => (!days || now - Date.parse(r.startedAt) <= days * 864e5) && (!src || srcName(r.source) === src));
  const opened = rows.length;
  const started = rows.filter(r => stepIdx(r) >= 1).length;
  const done = rows.filter(r => r.status === "完成");
  const line = done.filter(r => r.clickedSend === "是" || r.clickedAdd === "是" || r.copied === "是").length;
  const hi = done.filter(r => r.ready === "行動型").length;

  $("kpis").innerHTML = [
    ["打開頁面", opened, ""],
    ["按下開始", started, opened ? "打開的人當中 " + pct(started, opened) : ""],
    ["完成測驗", done.length, started ? "開始的人當中 " + pct(done.length, started) : ""],
    ["往 LINE 走", line, done.length ? "完成的人當中 " + pct(line, done.length) : ""],
    ["行動型", hi, done.length ? "完成的人當中 " + pct(hi, done.length) : ""]
  ].map(([l, v, h]) => `<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span><span class="h">${h || "&nbsp;"}</span></div>`).join("");

  /* funnel: how many reached each step */
  const reached = STEPS.map((_, i) => rows.filter(r => stepIdx(r) >= i).length);
  if (!opened) $("funnel").innerHTML = `<div class="empty">還沒有資料，等有人打開測驗後就會出現</div>`;
  else {
    const drops = reached.map((n, i) => i ? reached[i - 1] - n : 0);
    const worst = Math.max(...drops.slice(1));
    $("funnel").innerHTML = STEPS.map((s, i) => {
      const n = reached[i];
      const dropLine = i && drops[i] > 0
        ? `<div class="drop${drops[i] === worst ? " big" : ""}">↓ 這一步離開 ${drops[i]} 人（${pct(drops[i], reached[i - 1])}）</div>` : "";
      return dropLine + `<div class="bar"><span class="n">${esc(STEP_LABEL[s] || "答完" + s)}</span>
        <span class="t"><span class="f" style="width:${n / opened * 100}%;${i === STEPS.length - 1 ? "background:var(--forest)" : ""}"></span></span>
        <span class="c"><b>${n}</b> ${pct(n, opened)}</span></div>`;
    }).join("");
  }

  bars($("results"), count(done, "result"), done.length);
  bars($("topic"), count(done, "topic", ORDER.topic), done.length);
  bars($("ready"), count(done, "ready", ORDER.ready), done.length);
  bars($("source"), count(rows, "source"), opened);
  bars($("who"), count(done, "who", ORDER.who), done.length);
  bars($("howlong"), count(done, "howlong", ORDER.howlong), done.length);
  bars($("cope"), count(done, "cope", ORDER.cope), done.length);

  const recent = [...done].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 30);
  const fmt = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const cls = r => r === "行動型" ? "hi" : (r === "釐清型" || r === "傾訴型") ? "mid" : "";
  $("recent").innerHTML = recent.length ? `<table><thead><tr><th>時間</th><th>結果類型</th><th>準備度</th><th>想起的人</th><th>卡多久</th><th>因應方式</th><th>來源</th><th>LINE</th></tr></thead><tbody>${
    recent.map(r => `<tr><td>${fmt(r.updatedAt)}</td><td>${esc(r.result)}</td><td>${r.ready ? `<span class="pill ${cls(r.ready)}">${esc(r.ready)}</span>` : ""}</td>
      <td>${esc(r.who)}</td><td>${esc(r.howlong)}</td><td>${esc(r.cope)}</td><td>${esc(srcName(r.source))}</td>
      <td>${r.clickedSend === "是" ? "開啟 LINE 傳送" : r.copied === "是" ? "複製結果" : r.clickedAdd === "是" ? "點加好友" : ""}</td></tr>`).join("")
  }</tbody></table>` : `<div class="empty">還沒有人完成測驗</div>`;
}

function fillSources() {
  const names = [...new Set(ALL.map(r => srcName(r.source)))].sort();
  const sel = $("src"), cur = sel.value;
  sel.innerHTML = `<option value="">所有來源</option>` + names.map(n => `<option${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("");
}

async function refresh() {
  $("updated").textContent = "讀取中";
  try {
    ALL = await fetchRows(key);
    fillSources(); render();
    const d = new Date();
    $("updated").textContent = `共 ${ALL.length} 筆紀錄，更新於 ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  } catch (e) { $("updated").textContent = e.message; }
}

async function enter(k) {
  $("gateMsg").textContent = ""; $("enter").disabled = true;
  try {
    ALL = await fetchRows(k);
    key = k; store("forestStatsKey", k);
    $("gate").hidden = true; $("app").hidden = false;
    fillSources(); render();
    const d = new Date();
    $("updated").textContent = `共 ${ALL.length} 筆紀錄，更新於 ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  } catch (e) { $("gateMsg").textContent = e.message; store("forestStatsKey", null); }
  $("enter").disabled = false;
}

$("gateForm").addEventListener("submit", e => { e.preventDefault(); const k = $("key").value.trim(); if (k) enter(k); });
$("range").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  days = +b.dataset.d;
  $("range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  render();
});
$("src").addEventListener("change", e => { src = e.target.value; render(); });
$("reload").addEventListener("click", refresh);
$("logout").addEventListener("click", () => { store("forestStatsKey", null); location.reload(); });

const saved = load("forestStatsKey");
if (saved) { $("key").value = saved; enter(saved); }
</script>
</body>
</html>
